<style>

/* Layout: Entwurfsmappe – oben Reiter (Heute · A · B · C), je Reiter eine skalierte 1440er-Bühne bzw. 390er-Handy,
   darunter die Notizen. Tokens 1:1 aus app/globals.css (Dunkel Standard, Hell per data-theme="light"). */
:root {
  --bg: #1d1d1d; --surface: #2b2a27; --sunk: #242321; --line: #3d3b37;
  --ink: #fcf4e6; --text: #d9cfbd; --muted: #a8a195;
  --accent: #c2e689; --on-accent: #253912; --accent-ink: #c2e689; --logo: #f3efe6;
  --glass-tint: rgba(43, 42, 39, 0.38); --glass-tint-strong: rgba(36, 35, 33, 0.62);
  --glass-edge: rgba(252, 244, 230, 0.14); --glass-hi: rgba(252, 244, 230, 0.24);
  --glass-sheen: rgba(252, 244, 230, 0.08); --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
  --cA: #c2402a; --cB: #4d9cd0; --cC: #9d6500; --cD: #2ca8a0; --cE: #7b57b9; --cF: #66a758; --cG: #ca6db8;
  --cA-fg: #fcf4e6; --cB-fg: #1d1d1d; --cC-fg: #fcf4e6; --cD-fg: #1d1d1d; --cE-fg: #fcf4e6; --cF-fg: #1d1d1d; --cG-fg: #1d1d1d;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-sans: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --radius-card: 16px; --radius-pill: 40px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #fcf4e6; --surface: #faf8f4; --sunk: #f2e5cf; --line: #e3d7c2;
  --ink: #1d1d1d; --text: #3d3b37; --muted: #655f55; --accent-ink: #4a6b1a; --logo: #1d1d1d;
  --glass-tint: rgba(252, 248, 240, 0.42); --glass-tint-strong: rgba(252, 248, 240, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.4); --glass-shadow: 0 18px 50px rgba(29, 29, 29, 0.14);
  --cA: #b6341f; --cB: #3e8cc9; --cC: #8f5d04; --cD: #009b92; --cE: #6a45a6; --cF: #549a44; --cG: #c562b2;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #fcf4e6; --surface: #faf8f4; --sunk: #f2e5cf; --line: #e3d7c2;
  --ink: #1d1d1d; --text: #3d3b37; --muted: #655f55; --accent-ink: #4a6b1a; --logo: #1d1d1d;
  --glass-tint: rgba(252, 248, 240, 0.42); --glass-tint-strong: rgba(252, 248, 240, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.4); --glass-shadow: 0 18px 50px rgba(29, 29, 29, 0.14);
  --cA: #b6341f; --cB: #3e8cc9; --cC: #8f5d04; --cD: #009b92; --cE: #6a45a6; --cF: #549a44; --cG: #c562b2;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; color: var(--ink); letter-spacing: -0.014em; line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-weight: 700; font-size: 12px; letter-spacing: .125em; text-transform: uppercase; color: var(--accent-ink); }
.num { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.glass { background: linear-gradient(180deg, var(--glass-sheen), transparent 55%), var(--glass-tint);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }
.glass-strong { background: linear-gradient(180deg, var(--glass-sheen), transparent 45%), var(--glass-tint-strong);
  -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }

/* ───── Mappe ───── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-bottom: 1px solid var(--line);
  background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top-in { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--logo); }
.brand svg { height: 22px; width: auto; }
.brand span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tab { border-radius: var(--radius-pill); padding: 6px 14px; font-size: 14px; font-weight: 700; color: var(--ink); }
.tab:hover { background: var(--sunk); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border-radius: var(--radius-pill); padding: 2px; border: 1px solid var(--line); }
.seg button { border-radius: var(--radius-pill); padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: flex; flex-direction: column; gap: 32px; }
.intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; }
.intro h1 { font-size: clamp(28px, 3.4vw, 44px); }
.intro p.lead { max-width: 68ch; margin-top: 8px; }
.state { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .intro { grid-template-columns: 1fr; } }

/* Bühne: 1440×900 (Desktop) bzw. 390×844 (Handy), skaliert auf die verfügbare Breite */
.stage { position: relative; width: 100%; max-width: 100%; border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.stage.desk { aspect-ratio: 1440 / 900; }
.stage.phone { aspect-ratio: 390 / 844; width: min(100%, 390px); margin: 0 auto; border-radius: 32px; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--s, 1)); overflow: hidden; background: var(--bg); }
.desk .canvas { width: 1440px; height: 900px; }
.phone .canvas { width: 390px; height: 844px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .pair { grid-template-columns: 1fr; } }
.shot { width: 100%; display: block; border-radius: var(--radius-card); border: 1px solid var(--line); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.note { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.note h3 { font-size: 20px; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.note .eyebrow { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 12px; font-size: 13px; color: var(--text); }
.fact b { color: var(--ink); }
.cmp { overflow-x: auto; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
.cmp th, .cmp td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp th { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.cmp td:first-child { color: var(--ink); font-weight: 700; }
.reco { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 24px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.reco p { max-width: 75ch; }


/* ───── Bühne: nachgebautes Backend ───── */
.canvas { color: var(--text); font-size: 14px; line-height: 1.45; }
.b-head { position: absolute; inset: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 24px; padding: 0 32px; border-bottom: 1px solid var(--line); background: var(--bg); z-index: 3; }
.b-head .logo { color: var(--logo); display: flex; align-items: center; gap: 12px; }
.b-head .logo svg { height: 26px; width: auto; }
.b-head .logo span { color: var(--muted); font-size: 14px; }
.b-user { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.b-user b { color: var(--ink); }
.side { position: absolute; left: 0; top: 60px; bottom: 0; width: 240px; padding: 24px 16px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid var(--line); overflow: hidden; }
.grp { display: flex; flex-direction: column; gap: 2px; }
.grp > .gh { font-weight: 700; font-size: 10px; letter-spacing: .125em; text-transform: uppercase; color: var(--muted); padding: 0 12px 4px; }
.it { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 12px; padding: 6px 12px; color: var(--text); }
.it.on { background: var(--ink); color: var(--bg); font-weight: 700; }
.cnt { font-family: var(--font-display); font-weight: 800; font-size: 11px; border-radius: 999px; padding: 0 7px; background: var(--line); color: var(--ink); font-variant-numeric: tabular-nums; }
.it.on .cnt { background: var(--bg); color: var(--ink); }
.content { position: absolute; top: 60px; right: 0; bottom: 0; overflow: hidden; padding: 28px 32px; display: flex; flex-direction: column; gap: 24px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
.h1 { font-family: var(--font-display); font-weight: 800; color: var(--ink); font-size: 40px; line-height: 1.05; letter-spacing: -.014em; }
.h2 { font-family: var(--font-display); font-weight: 800; color: var(--ink); font-size: 22px; line-height: 1.1; }
.h3 { font-family: var(--font-display); font-weight: 800; color: var(--ink); font-size: 17px; line-height: 1.15; }
.small { font-size: 12px; color: var(--muted); }
.small b { color: var(--ink); }
.bdg { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 40px; padding: 0 8px; font-size: 11px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.bdg.muted { color: var(--muted); }
.ex { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px dashed var(--line); border-radius: 40px; padding: 0 7px; white-space: nowrap; }
.rel { letter-spacing: .15em; color: var(--ink); font-size: 11px; }
.rel s { text-decoration: none; color: var(--line); }
.lnk { color: var(--accent-ink); font-size: 13px; font-weight: 700; white-space: nowrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; padding: 4px 12px; font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--ink); white-space: nowrap; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.warn { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--sunk); }
.warn::before { content: "!"; flex: none; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); color: var(--bg); font-weight: 800; font-size: 11px; }
.lime { background: var(--accent); color: var(--on-accent); border-radius: 16px; }
.lime .eyebrow, .lime .h1, .lime .h2, .lime .h3, .lime b, .lime .small { color: var(--on-accent); }
.row { display: flex; align-items: center; gap: 12px; }
.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 10px; letter-spacing: .125em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr.hi td { background: var(--sunk); }
.ico { width: 16px; height: 16px; flex: none; }
.tabsb { display: flex; gap: 4px; }
.tabsb span { padding: 6px 14px; border-radius: 40px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.tabsb span.on { background: var(--ink); color: var(--bg); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 40px; padding: 1px 10px 1px 3px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; background: none; }
.chip i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 800; font-family: var(--font-display); }
.badge-new { position: relative; display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; background: var(--ink); color: var(--bg); padding: 2px 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
.badge-new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.ping::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--ink); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .ping::after { animation: none; } }
.blink-r::after, .blink-y::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; pointer-events: none; }
.blink-r::after { border-radius: 9px; border: 2px solid var(--cA); animation: blink 1.1s ease-in-out infinite; }
.blink-y::after { border: 2px solid var(--cC); animation: blink 2.2s ease-in-out infinite; }
@keyframes blink { 0%, 100% { opacity: 0; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
.toast-in { animation: tin .35s ease-out; }
@keyframes tin { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .blink-r::after, .blink-y::after { animation: none; opacity: 1; } .toast-in { animation: none; } }
.drop { position: absolute; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--glass-shadow); padding: 8px; width: 260px; display: flex; flex-direction: column; gap: 2px; }
</style>
<style>
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 7px; font-size: 11px; font-weight: 700; background: var(--sunk); color: var(--text); border: 1px solid var(--line); white-space: nowrap; }
.tag.tr { border-radius: 40px; padding: 1px 8px 1px 2px; }
.tag.tr i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; font-size: 9px; font-family: var(--font-display); }
.agent { border: 1px solid var(--line); border-radius: 14px; background: var(--sunk); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.agent-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.agent-h::before { content: "◆"; color: var(--ink); font-size: 10px; letter-spacing: 0; }
.fit { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }
.fitbar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
.fitbar span { display: block; height: 100%; background: var(--ink); }
.conf { display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; padding: 2px 10px; font-size: 11px; font-weight: 700; border: 1.5px dashed var(--ink); color: var(--ink); white-space: nowrap; }
.seal { display: inline-flex; align-items: center; gap: 6px; border-radius: 40px; padding: 2px 10px 2px 3px; font-size: 11px; font-weight: 700; background: var(--accent); color: var(--on-accent); white-space: nowrap; }
.seal::before { content: "✓"; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--on-accent); color: var(--accent); font-size: 10px; }
.steps { display: flex; gap: 0; }
.steps span { flex: 1; font-size: 11px; font-weight: 700; padding: 5px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.steps span:first-child { border-radius: 40px 0 0 40px; }
.steps span:last-child { border-radius: 0 40px 40px 0; }
.steps span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.steps span.done { color: var(--ink); }
</style>

/* ───── Steuerung ───── */
function effectiveMode() { const t = document.documentElement.dataset.theme; if (t === "light" || t === "dark") return t; return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
function fit() { document.querySelectorAll("[data-stage]").forEach((s) => { const w = s.classList.contains("phone") ? 390 : 1440; s.querySelector(".canvas").style.setProperty("--s", s.clientWidth / w); }); }
function render() {
  document.documentElement.dataset.mode = effectiveMode();
  const v = state.view;
  document.querySelectorAll(".tab").forEach((a) => a.dataset.v === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-dev]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.dev === state.dev));
  document.querySelectorAll("[data-th]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.th === document.documentElement.dataset.mode));
  document.getElementById("main").innerHTML = v === "heute" ? todayPage() : v === "modell" ? modellPage() : variantPage(v);
  fit();
}
function route() { const h = location.hash.slice(1); state.view = ["heute", "eingang", "datenbank", "eintrag", "challenge", "modell"].includes(h) ? h : "heute"; state.menu = false; render(); }
document.addEventListener("click", (e) => {
  const q = (s) => e.target.closest(s);
  let el;
  if ((el = q("[data-dev]"))) { state.dev = el.dataset.dev; state.menu = false; return render(); }
  if ((el = q("[data-th]"))) { document.documentElement.dataset.theme = el.dataset.th; return render(); }
  if (q("[data-menu]")) { state.menu = !state.menu; return render(); }
  if ((el = q("[data-role]"))) { state.role = el.dataset.role; return render(); }
  if ((el = q("[data-tag]"))) { const t = el.dataset.tag; state.tag = !t || state.tag === t ? null : t; return render(); }
  if ((el = q("[data-open]"))) { location.hash = "eintrag"; return; }
  if ((el = q("[data-ptab]"))) { state.ptab = el.dataset.ptab; return render(); }
  if ((el = q("[data-ctab]"))) { state.ctab = el.dataset.ctab; return render(); }
  if ((el = q("[data-cl]"))) { state.cl = el.dataset.cl; return render(); }
  if ((el = q("[data-conf]"))) { state.conf = +el.dataset.conf; return render(); }
  if ((el = q("[data-sug]"))) { const [id, v] = el.dataset.sug.split(":"); if (v) state.sugg[id] = v; else delete state.sugg[id]; return render(); }
  if ((el = q("[data-short]"))) { const [id, v] = el.dataset.short.split(":"); if (v) state.short[id] = v; else delete state.short[id]; return render(); }
});
addEventListener("hashchange", route);
addEventListener("resize", fit);
matchMedia("(prefers-color-scheme: light)").addEventListener("change", render);
new MutationObserver(() => { if (effectiveMode() !== document.documentElement.dataset.mode) render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
route();
</script>
