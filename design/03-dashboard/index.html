<style>
/* Layout: Entwurfsmappe – oben Reiter (Heute · A · B · C), je Reiter eine skalierte 1440er-Bühne bzw. 390er-Handy,
   darunter die Notizen. Tokens 1:1 aus app/globals.css (Dunkel Standard, Hell per data-theme="light"). */
:root {
  --bg: #1d1d1d; --surface: #2b2a27; --sunk: #242321; --line: #3d3b37;
  --ink: #fcf4e6; --text: #d9cfbd; --muted: #a8a195;
  --accent: #c2e689; --on-accent: #253912; --accent-ink: #c2e689; --logo: #f3efe6;
  --glass-tint: rgba(43, 42, 39, 0.38); --glass-tint-strong: rgba(36, 35, 33, 0.62);
  --glass-edge: rgba(252, 244, 230, 0.14); --glass-hi: rgba(252, 244, 230, 0.24);
  --glass-sheen: rgba(252, 244, 230, 0.08); --glass-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
  --cA: #c2402a; --cB: #4d9cd0; --cC: #9d6500; --cD: #2ca8a0; --cE: #7b57b9; --cF: #66a758; --cG: #ca6db8;
  --cA-fg: #fcf4e6; --cB-fg: #1d1d1d; --cC-fg: #fcf4e6; --cD-fg: #1d1d1d; --cE-fg: #fcf4e6; --cF-fg: #1d1d1d; --cG-fg: #1d1d1d;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-sans: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --radius-card: 16px; --radius-pill: 40px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #fcf4e6; --surface: #faf8f4; --sunk: #f2e5cf; --line: #e3d7c2;
  --ink: #1d1d1d; --text: #3d3b37; --muted: #655f55; --accent-ink: #4a6b1a; --logo: #1d1d1d;
  --glass-tint: rgba(252, 248, 240, 0.42); --glass-tint-strong: rgba(252, 248, 240, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.4); --glass-shadow: 0 18px 50px rgba(29, 29, 29, 0.14);
  --cA: #b6341f; --cB: #3e8cc9; --cC: #8f5d04; --cD: #009b92; --cE: #6a45a6; --cF: #549a44; --cG: #c562b2;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #fcf4e6; --surface: #faf8f4; --sunk: #f2e5cf; --line: #e3d7c2;
  --ink: #1d1d1d; --text: #3d3b37; --muted: #655f55; --accent-ink: #4a6b1a; --logo: #1d1d1d;
  --glass-tint: rgba(252, 248, 240, 0.42); --glass-tint-strong: rgba(252, 248, 240, 0.72);
  --glass-edge: rgba(255, 255, 255, 0.75); --glass-hi: rgba(255, 255, 255, 0.95);
  --glass-sheen: rgba(255, 255, 255, 0.4); --glass-shadow: 0 18px 50px rgba(29, 29, 29, 0.14);
  --cA: #b6341f; --cB: #3e8cc9; --cC: #8f5d04; --cD: #009b92; --cE: #6a45a6; --cF: #549a44; --cG: #c562b2;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 16px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; color: var(--ink); letter-spacing: -0.014em; line-height: 1.1; text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-weight: 700; font-size: 12px; letter-spacing: .125em; text-transform: uppercase; color: var(--accent-ink); }
.num { font-family: var(--font-display); font-weight: 800; font-variant-numeric: tabular-nums; }
.glass { background: linear-gradient(180deg, var(--glass-sheen), transparent 55%), var(--glass-tint);
  -webkit-backdrop-filter: blur(22px) saturate(170%); backdrop-filter: blur(22px) saturate(170%);
  border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }
.glass-strong { background: linear-gradient(180deg, var(--glass-sheen), transparent 45%), var(--glass-tint-strong);
  -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid var(--glass-edge); box-shadow: inset 0 1px 0 var(--glass-hi), var(--glass-shadow); }

/* ───── Mappe ───── */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-bottom: 1px solid var(--line);
  background: var(--bg); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top-in { max-width: 1440px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; color: var(--logo); }
.brand svg { height: 22px; width: auto; }
.brand span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tab { border-radius: var(--radius-pill); padding: 6px 14px; font-size: 14px; font-weight: 700; color: var(--ink); }
.tab:hover { background: var(--sunk); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; border-radius: var(--radius-pill); padding: 2px; border: 1px solid var(--line); }
.seg button { border-radius: var(--radius-pill); padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

main { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 64px; display: flex; flex-direction: column; gap: 32px; }
.intro { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 32px; align-items: end; }
.intro h1 { font-size: clamp(28px, 3.4vw, 44px); }
.intro p.lead { max-width: 68ch; margin-top: 8px; }
.state { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
@media (max-width: 760px) { .intro { grid-template-columns: 1fr; } }

/* Bühne: 1440×900 (Desktop) bzw. 390×844 (Handy), skaliert auf die verfügbare Breite */
.stage { position: relative; width: 100%; max-width: 100%; border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--line); background: var(--bg); }
.stage.desk { aspect-ratio: 1440 / 900; }
.stage.phone { aspect-ratio: 390 / 844; width: min(100%, 390px); margin: 0 auto; border-radius: 32px; }
.canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; transform: scale(var(--s, 1)); overflow: hidden; background: var(--bg); }
.desk .canvas { width: 1440px; height: 900px; }
.phone .canvas { width: 390px; height: 844px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start; }
@media (max-width: 1000px) { .pair { grid-template-columns: 1fr; } }
.shot { width: 100%; display: block; border-radius: var(--radius-card); border: 1px solid var(--line); }

.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; }
.note { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.note h3 { font-size: 20px; }
.note ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.note .eyebrow { color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 12px; font-size: 13px; color: var(--text); }
.fact b { color: var(--ink); }
.cmp { overflow-x: auto; }
.cmp table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
.cmp th, .cmp td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cmp th { color: var(--muted); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.cmp td:first-child { color: var(--ink); font-weight: 700; }
.reco { border: 1px solid var(--line); border-radius: var(--radius-card); padding: 24px; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.reco p { max-width: 75ch; }

/* ───── Bühne: nachgebaute App-Oberfläche ───── */
.world { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; }
.world img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.world .scene-light { display: none; }
html[data-mode="light"] .world .scene-dark { display: none; }
html[data-mode="light"] .world .scene-light { display: block; }
.pulse { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--ink); }
.pulse::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--ink); animation: ping 1.8s ease-out infinite; }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pulse::after, .ping::after { animation: none; } }

.m-head { position: absolute; inset: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 24px; padding: 0 32px 0 92px; z-index: 5;
  border-bottom: 1px solid var(--glass-edge); background: var(--glass-tint-strong); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); }
.m-head .logo { color: var(--logo); display: flex; align-items: center; gap: 12px; font-size: 14px; }
.m-head .logo svg { height: 26px; width: auto; }
.m-head .logo span { color: var(--muted); }
.m-nav { display: flex; gap: 4px; font-size: 14px; font-weight: 700; color: var(--ink); }
.m-nav span { padding: 6px 12px; border-radius: var(--radius-pill); }
.m-nav span.on { background: var(--ink); color: var(--bg); }
.m-user { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
.m-user b { color: var(--ink); }
.m-user .due { border: 1px solid var(--glass-edge); border-radius: var(--radius-pill); padding: 4px 10px; }
.m-user .due b { font-weight: 700; }

.ui { position: absolute; z-index: 4; color: var(--ink); font-size: 14px; }
.pill { border-radius: var(--radius-pill); padding: 6px 16px; font-weight: 700; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.mseg { display: inline-flex; border-radius: var(--radius-pill); padding: 2px; }
.mseg span, .mseg button { border-radius: var(--radius-pill); padding: 5px 14px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.mseg .on { background: var(--ink); color: var(--bg); }
.sep { width: 1px; align-self: stretch; margin: 6px 4px; background: var(--glass-edge); }
.ico { width: 16px; height: 16px; flex: none; }

.phases { display: flex; overflow: hidden; border-radius: var(--radius-card); }
.phases > div { display: flex; flex-direction: column; padding: 12px 16px; min-width: 150px; }
.phases dt { font-weight: 700; font-size: 10px; letter-spacing: .125em; text-transform: uppercase; color: var(--muted); }
.phases dd { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.phases .kick { background: var(--accent); }
.phases .kick dt, .phases .kick dd { color: var(--on-accent); }
.found { border-radius: var(--radius-pill); padding: 6px 16px; font-size: 14px; color: var(--muted); }
.found b { color: var(--ink); font-family: var(--font-display); }

.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 1px 10px 1px 3px; font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; }
.chip i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 10px; font-weight: 800; font-family: var(--font-display); }
.badge-new { position: relative; display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-pill); background: var(--ink); color: var(--bg); padding: 2px 10px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
.badge-new::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--bg); }
.ping::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--ink); animation: ping 1.8s ease-out infinite; }
.newdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); flex: none; }

.tk-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tk-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 12px; letter-spacing: .125em; text-transform: uppercase; color: var(--ink); }
.tk-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.round { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink); font-size: 14px; }
.meta { font-size: 12px; color: var(--muted); }
.meta b { color: var(--ink); }
.hl { font-weight: 700; color: var(--ink); line-height: 1.35; }
.foot { font-size: 11px; color: var(--muted); }
.select { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 3px 12px; font-size: 12px; font-weight: 700; color: var(--ink); }

/* Popover A */
.pop { position: absolute; z-index: 6; border-radius: var(--radius-card); padding: 16px; width: 300px; display: flex; flex-direction: column; gap: 14px; color: var(--text); font-size: 13px; }
.pop .eyebrow { color: var(--muted); font-size: 10px; }
</style>

/* ───── Steuerung ───── */
function effectiveMode() {
  const t = document.documentElement.dataset.theme;
  if (t === "light" || t === "dark") return t;
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function fit() {
  document.querySelectorAll("[data-stage]").forEach((s) => {
    const w = s.classList.contains("phone") ? 390 : 1440;
    s.querySelector(".canvas").style.setProperty("--s", s.clientWidth / w);
  });
}
function render() {
  document.documentElement.dataset.mode = effectiveMode();
  const v = state.view;
  document.querySelectorAll(".tab").forEach((a) => a.dataset.v === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll("[data-dev]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.dev === state.dev));
  document.querySelectorAll("[data-th]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.th === document.documentElement.dataset.mode));
  const main = document.getElementById("main");
  main.innerHTML = v === "heute" ? todayPage() : v === "vergleich" ? comparePage() : variantPage(v);
  fit();
}
function route() {
  const h = location.hash.slice(1);
  state.view = ["heute", "a", "b", "c", "vergleich"].includes(h) ? h : "heute";
  state.pop = false;
  render();
}
document.addEventListener("click", (e) => {
  const dev = e.target.closest("[data-dev]");
  if (dev) { state.dev = dev.dataset.dev; render(); return; }
  const th = e.target.closest("[data-th]");
  if (th) { document.documentElement.dataset.theme = th.dataset.th; render(); return; }
  const set = e.target.closest("[data-set]");
  if (set) { const [v, o] = set.dataset.set.split(":"); state.open[v] = o === "1"; state.pop = false; render(); return; }
  const tg = e.target.closest("[data-toggle]");
  if (tg) { const v = tg.dataset.toggle; state.open[v] = !state.open[v]; render(); return; }
  const pop = e.target.closest("[data-pop]");
  if (pop) { state.pop = !state.pop; render(); return; }
});
addEventListener("hashchange", route);
addEventListener("resize", fit);
matchMedia("(prefers-color-scheme: light)").addEventListener("change", render);
new MutationObserver(() => { const m = effectiveMode(); if (m !== document.documentElement.dataset.mode) render(); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
route();
